# ClarioSuite sync every 6 hours via GitHub Actions.
# Media insights already skip rows fresh within 12h — 6h cadence cuts API/DB
# churn without losing useful freshness. Vercel Hobby only allows once-per-day
# crons in vercel.json — do not move this schedule into vercel.json.
name: ClarioSuite sync (every 6h)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger ClarioSuite incremental sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret CRON_SECRET (must match Vercel CRON_SECRET)."
            exit 1
          fi
          BASE_URL="${APP_URL:-https://www.gunzoteam.com}"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 290 \
            "${BASE_URL%/}/api/cron/sync-clariosuite"
          echo
          echo "ClarioSuite sync triggered OK"
